plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}
apply from: '../jacoco.gradle'

// Task to convert AAR (classes.jar) to DEX at build time for BioSDKLoader runtime loading.
// Standard AARs contain classes.jar (Java bytecode); Android runtime requires DEX format.
def biosdkAssetsDir = file("${projectDir}/src/main/assets/biosdk")
def biosdkDexOutputDir = file("${buildDir}/biosdk-dex/biosdk")

configurations { dexify }

tasks.register('dexifyBiosdkAars') {
    description = 'Convert AAR classes.jar to DEX format for runtime BioSDK loading'
    group = 'build'
    doLast {
        if (!biosdkAssetsDir.exists()) return
        def aarFiles = fileTree(biosdkAssetsDir).filter { it.name.endsWith('.aar') }.files

        def sdkDir = android.sdkDirectory
        def androidJar = new File(sdkDir, "platforms/${android.compileSdkVersion}/android.jar")
        if (!androidJar.exists()) {
            throw new GradleException("android.jar not found at ${androidJar}")
        }

        biosdkDexOutputDir.mkdirs()
        // Purge stale dex outputs when AARs are removed
        def aarBaseNames = aarFiles.collect { it.name.replaceAll('\\.aar$', '') } as Set
        biosdkDexOutputDir.listFiles()?.findAll { it.name.endsWith('.jar') }?.each { f ->
            def jarBase = f.name.replaceAll('\\.jar$', '')
            if (!aarBaseNames.contains(jarBase)) {
                println "dexifyBiosdkAars: Removing stale output (no AAR): ${f.name}"
                f.delete()
            }
        }
        if (aarFiles.isEmpty()) return

        def workDir = file("${buildDir}/biosdk-dex/work")
        workDir.mkdirs()

        aarFiles.each { aarFile ->
            def baseName = aarFile.name.replaceAll('\\.aar$', '')
            def vendorJar = new File(biosdkAssetsDir, "${baseName}.jar")
            def outputJar = new File(biosdkDexOutputDir, "${baseName}.jar")
            if (vendorJar.exists()) {
                println "dexifyBiosdkAars: Vendor provided ${baseName}.jar (DEX already), skipping AAR conversion"
                if (outputJar.exists()) outputJar.delete()
                return
            }
            if (outputJar.exists() && outputJar.lastModified() >= aarFile.lastModified()) {
                println "dexifyBiosdkAars: ${baseName}.jar up to date, skipping"
                return
            }
            println "dexifyBiosdkAars: Converting ${aarFile.name} -> ${baseName}.jar"

            // Extract classes.jar from AAR (AAR has classes.jar at root or in jars/)
            def classesJar = new File(workDir, "${baseName}-classes.jar")
            def extractDir = new File(workDir, "extract-${baseName}")
            project.delete(extractDir)
            extractDir.mkdirs()
            project.copy {
                from project.zipTree(aarFile)
                into extractDir
            }
            def srcJar = new File(extractDir, 'classes.jar')
            if (!srcJar.exists()) srcJar = new File(extractDir, 'jars/classes.jar')
            if (!srcJar.exists()) {
                println "dexifyBiosdkAars: No classes.jar in ${aarFile.name}, skipping"
                return
            }
            project.copy { from srcJar; into workDir; rename { "${baseName}-classes.jar" } }

            def dexOutDir = new File(workDir, "${baseName}-dex")
            project.delete(dexOutDir)
            dexOutDir.mkdirs()
            javaexec {
                classpath = configurations.dexify
                mainClass = 'com.android.tools.r8.D8'
                args = [
                    '--output', dexOutDir,
                    '--lib', androidJar,
                    '--min-api', android.defaultConfig.minSdkVersion.apiLevel,
                    classesJar
                ]
            }

            def dexFile = new File(dexOutDir, 'classes.dex')
            if (!dexFile.exists()) {
                throw new GradleException("D8 did not produce classes.dex for ${aarFile.name}")
            }

            // Create JAR containing classes.dex (DexClassLoader accepts JAR with classes.dex)
            outputJar.delete()
            project.ant.jar(destfile: outputJar) {
                zipfileset(dir: dexOutDir, includes: '*.dex')
            }
            println "dexifyBiosdkAars: Created ${outputJar.name}"
        }
    }
}

android {
    namespace "io.mosip.registration.clientmanager"

    lintOptions {
        abortOnError false
        ignoreWarnings true
        checkReleaseBuilds false
        // Lint in AGP 8.2.x cannot read Java 21 class files (major version 65)
        disable 'InvalidPackage'
    }

    buildFeatures {
        buildConfig true
    }
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
        versionCode 1
        versionName "1.0"
        buildConfigField("String", "CLIENT_VERSION", rootProject.ext.clientmanagerLibVersionName)
        buildConfigField("String", "BASE_URL", rootProject.ext.serverBaseURL)
        buildConfigField("String", "DEBUG_PASSWORD", rootProject.ext.debugPassword)
        buildConfigField("long", "HTTP_READ_TIMEOUT", "${rootProject.ext.httpReadTimeout}L")
        buildConfigField("long", "HTTP_WRITE_TIMEOUT", "${rootProject.ext.httpWriteTimeout}L")
    }

    buildTypes {
        debug {
            testCoverageEnabled true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    kotlin {
        jvmToolchain(21)
    }

    sourceSets {
        main {
            assets {
                // Prepend dexified output so DEX-JAR takes precedence over raw AAR
                srcDirs "${buildDir}/biosdk-dex/biosdk", 'src/main/assets'
            }
        }
    }

    libraryVariants.every { variant ->
        variant.outputs.each { output ->
            def outputFile = output.outputFile
            if (outputFile != null && outputFile.name.endsWith('.aar')) {
                output.outputFile = new File(projectDir, '../app/new_libs/' + outputFile.name)
            }
        }
    }
}

// Run dexify before clientmanager merges assets
afterEvaluate {
    ['mergeDebugAssets', 'mergeReleaseAssets'].each { taskName ->
        tasks.findByName(taskName)?.dependsOn(dexifyBiosdkAars)
    }
}

dependencies {
    def work_version = "2.7.1"

    // R8/D8 for dexifyBiosdkAars task (DEX conversion)
    dexify 'com.android.tools:r8:3.0.73'

    implementation 'com.google.dagger:dagger:2.41'
    implementation 'com.google.dagger:dagger-android-support:2.41'
    annotationProcessor 'com.google.dagger:dagger-compiler:2.41'
    annotationProcessor 'com.google.dagger:dagger-android-processor:2.41'

    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'

    implementation 'javax.validation:validation-api:2.0.1.Final'

    implementation 'com.cronutils:cron-utils:9.2.0'

    //AspectJ
    implementation 'org.aspectj:aspectjrt:1.9.7'

    // https://mvnrepository.com/artifact/io.swagger.core.v3/swagger-annotations
    implementation 'io.swagger.core.v3:swagger-annotations:2.1.11'

    implementation "androidx.room:room-runtime:2.4.2"
    annotationProcessor "androidx.room:room-compiler:2.4.2"

    implementation "net.zetetic:android-database-sqlcipher:4.5.3"
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    implementation 'org.json:json:20231013'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.8.1'
    testImplementation 'org.springframework:spring-test:5.3.20'
    testImplementation 'org.slf4j:slf4j-simple:2.0.13'

    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.10.0'
    androidTestImplementation "org.mockito:mockito-android:5.11.0"
    testImplementation "junit:junit:4.13.2"
    // Mockito 5.x uses byte-buddy 1.14+/ASM 9.5+ which supports Java 21 class files
    // mockito-inline is merged into mockito-core in 5.x (no longer a separate artifact)
    testImplementation "org.mockito:mockito-core:5.11.0"
    testImplementation 'org.robolectric:robolectric:4.12.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.10.0'
    testImplementation "androidx.test:core:1.5.0"



    // (Java only)
    implementation "androidx.work:work-runtime:$work_version"

    // https://mvnrepository.com/artifact/com.squareup.retrofit2/retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.okio:okio:3.4.0'
    implementation 'com.squareup.okhttp3:okhttp:4.9.2'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // JWT decoding library
    implementation 'com.auth0.android:jwtdecode:2.0.1'

    // https://mvnrepository.com/artifact/commons-io/commons-io
    implementation group: 'commons-io', name: 'commons-io', version: '2.14.0'

    implementation 'com.fasterxml.jackson.core:jackson-core:2.15.0-rc1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.13.4.1'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.13.2'

    implementation 'org.apache.velocity:velocity:1.7'
    implementation 'org.mvel:mvel2:2.4.14.Final'

    implementation('com.tom-roush:pdfbox-android:2.0.27.0') {
        exclude group: 'org.bouncycastle'
    }

    implementation 'dev.keiji.jp2:jp2-android:1.0.5'

    implementation('io.mosip.biometric.util:biometrics-util:1.3.0') {
        exclude group: 'org.springframework.boot'
        exclude group: 'org.springframework'
        exclude group: 'org.springframework.data'
        exclude group: 'com.fasterxml.jackson.core'
        exclude group: 'org.projectlombok'
        exclude group: 'org.openpnp'
        exclude group: 'org.junit'
        exclude group: 'jakarta.xml.bind'
        exclude group: 'jakarta.annotation'
        exclude group: 'jakarta.activation'
        exclude group: 'javax.activation'
        exclude group: 'org.apache.tomcat'
        exclude group: 'aopalliance'
        exclude group: 'commons-logging'
        exclude group: 'com.google.code.findbugs'
        exclude group: 'org.aspectj', module: 'aspectjweaver'
    }
    // https://mvnrepository.com/artifact/org.slf4j/slf4j-api
    implementation group: 'org.slf4j', name: 'slf4j-api', version: '2.0.0-alpha7'

    // added packet-manager Android library module as a dependency
    implementation project(':packetmanager')
    implementation project(':keymanager')

    implementation 'com.github.kenglxn.QRGen:android:3.0.1'
    implementation("io.mosip.kernel:kernel-biometrics-api:1.2.0.3"){
        transitive = false
    }
    implementation 'com.google.code.gson:gson:2.10.1'
}
