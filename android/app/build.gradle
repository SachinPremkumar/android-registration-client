plugins {
    id "org.sonarqube" version "6.0.1.5171"
    id 'jacoco'
}
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    localProperties.load(new FileInputStream(keystorePropertiesFile))
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"
apply plugin: 'jacoco'

jacoco {
    toolVersion = "0.8.12"
}

// Force Jacoco 0.8.12 across all configurations, including AGP's internal ones.
// AGP 8.2.x defaults to Jacoco 0.8.8 (which cannot instrument Java 21 bytecode).
// resolutionStrategy.force overrides strict version constraints.
configurations.configureEach {
    resolutionStrategy {
        force 'org.jacoco:org.jacoco.agent:0.8.12'
        force 'org.jacoco:org.jacoco.core:0.8.12'
        force 'org.jacoco:org.jacoco.report:0.8.12'
        force 'org.jacoco:org.jacoco.ant:0.8.12'
    }
}

// Ensure bioSdk DEX conversion runs before asset merge
afterEvaluate {
    ['mergeDebugAssets', 'mergeReleaseAssets'].each { taskName ->
        tasks.findByName(taskName)?.dependsOn(':clientmanager:dexifyBiosdkAars')
    }
}

android {

    namespace "io.mosip.registration_client"

    lintOptions {
        abortOnError false
        ignoreWarnings true
        checkReleaseBuilds false
        disable 'InvalidPackage'
    }
    compileSdk 34
    ndkVersion "25.1.8937393"

    buildFeatures {
        buildConfig true
    }

    compileOptions {

        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                jvmArgs(
                    '-XX:+EnableDynamicAgentLoading',
                    '-Dnet.bytebuddy.experimental=true',
                    '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
                    '--add-opens', 'java.base/java.util=ALL-UNNAMED',
                    '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED'
                )
            }
        }
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "io.mosip.registration_client"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion 28
        targetSdkVersion flutter.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField("String", "BASE_URL", rootProject.ext.serverBaseURL)
        buildConfigField("String", "HEALTH_CHECK_PATH", rootProject.ext.serverHealthCheckPath)
        buildConfigField("String", "ACTUATOR_INFO_PATH", rootProject.ext.serverActuatorInfoPath)
        multiDexEnabled true
    }

    signingConfigs {
        release {
            keyAlias = localProperties['keyAlias']
            keyPassword = localProperties['keyPassword']
            storeFile = localProperties['storeFile'] ? file(localProperties['storeFile']) : null
            storePassword = localProperties['storePassword']
        }
    }

    buildTypes {
        debug {
        }
        release {
            lintOptions {
                checkReleaseBuilds false
                abortOnError false
            }
            minifyEnabled false
            shrinkResources false
            // Use release keystore if configured in local.properties, otherwise fall back to debug
            signingConfig signingConfigs.release.storeFile != null ? signingConfigs.release : signingConfigs.debug
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'
                // architectures: 'armeabi-v7a', 'arm64-v8a', 'armeabi', 'x86', 'x86_64'
            }
        }
    }
    packagingOptions {
        resources.merges.add("git.properties")
        resources.excludes.add("META-INF/*")
        resources.excludes.add("META-INF/**")
    }
    sonar {
        properties {
            property "sonar.projectKey", "rajapandi1234_android-registration-client"
            property "sonar.organization", "test-integrations"
            property "sonar.host.url", "https://sonarcloud.io"
            property "sonar.login", "13c9437b3fa54b66de5ec14c4fc2bd04fb55ae77"
        }
    }
}
tasks.register("jacocoTestReport", JacocoReport) {
    dependsOn "testDebugUnitTest" // Ensure tests run before generating report

    reports {
        html.required.set(true)
        xml.required.set(true)
    }

    sourceDirectories.setFrom(files(["src/main/java"]))
    classDirectories.setFrom(files([
            fileTree(dir: "${buildDir}/intermediates/javac/debug", includes: ["**/*.class"]),
            fileTree(dir: "${buildDir}/tmp/kotlin-classes/debug", includes: ["**/*.class"])
    ]))
    executionData.setFrom(fileTree(dir: buildDir, includes: ["**/*.exec", "**/*.ec"]))
}
flutter {
    source '../..'
}

dependencies {
    def fragment_version = "1.4.1"
    def room_version = "2.4.2"

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    // DI
    implementation 'javax.inject:javax.inject:1'
    implementation 'com.google.dagger:dagger:2.41'
    implementation 'com.google.dagger:dagger-android-support:2.41'
    annotationProcessor 'com.google.dagger:dagger-compiler:2.41'
    annotationProcessor 'com.google.dagger:dagger-android-processor:2.41'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'

    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.4.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    implementation "androidx.fragment:fragment:$fragment_version"
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation 'androidx.preference:preference:1.2.0'
    implementation 'androidx.navigation:navigation-fragment:2.4.2'
    implementation 'androidx.navigation:navigation-ui:2.4.2'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation "androidx.work:work-runtime:2.7.1"

    // Room
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

    // Network
    implementation 'com.squareup.okhttp3:okhttp:4.9.2'
    implementation 'com.squareup.okio:okio:3.4.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // JSON
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.15.0-rc1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.13.4.1'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.13.2'

    // Apache Commons
    implementation group: 'org.apache.commons', name: 'commons-collections4', version: '4.4'
    implementation 'org.apache.commons:commons-lang3:3.12.0'
    implementation 'commons-codec:commons-codec:1.15'
    implementation group: 'commons-io', name: 'commons-io', version: '2.14.0'

    // Security / Auth
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    implementation 'com.auth0.android:jwtdecode:2.0.1'

    // Validation
    implementation 'javax.validation:validation-api:2.0.1.Final'

    // Cron
    implementation 'com.cronutils:cron-utils:9.1.7'

    // AspectJ
    implementation 'org.aspectj:aspectjrt:1.9.7'

    // Swagger
    implementation 'io.swagger.core.v3:swagger-annotations:2.1.11'

    // Template engines
    implementation 'org.apache.velocity:velocity:1.7'
    implementation 'org.mvel:mvel2:2.4.14.Final'

    // PDF / Image
    implementation('com.tom-roush:pdfbox-android:2.0.27.0') {
        exclude group: 'org.bouncycastle'
    }
    implementation 'dev.keiji.jp2:jp2-android:1.0.5'
    implementation("com.github.jai-imageio:jai-imageio-core:1.3.0")

    // BioMetrics
    implementation('io.mosip.biometric.util:biometrics-util:1.2.0.2') {
        exclude group: 'org.springframework.boot'
        exclude group: 'com.fasterxml.jackson.core'
        exclude group: 'org.projectlombok'
        exclude group: 'org.openpnp'
    }

    // Logging
    implementation group: 'org.slf4j', name: 'slf4j-api', version: '2.0.0-alpha7'

    // UI extras
    implementation 'com.balysv:material-ripple:1.0.2'

    // Internal modules
    implementation project(':clientmanager')
    implementation project(':keymanager')
    implementation project(':packetmanager')
    implementation project(':transliterationmanager')

    // Android instrumented tests
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:3.14.9'
    androidTestImplementation "org.mockito:mockito-android:5.11.0"
    androidTestImplementation "androidx.room:room-runtime:$room_version"

    // Unit tests
    testImplementation "androidx.room:room-runtime:$room_version"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.mockito:mockito-core:5.11.0"
    testImplementation 'org.robolectric:robolectric:4.12.2'
}
