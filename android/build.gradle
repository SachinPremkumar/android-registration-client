ext {
    compileSdkVersion = 34
    buildToolsVersion = "34.0.0"

    minSdkVersion = 28
    targetSdkVersion = 34

    junitVersion = "4.+"

    // clientmanager Library Info
    clientmanagerLibVersionCode = 1
    clientmanagerLibVersionName = "\"1.0.0\""

    serverBaseURL = "\"https://api-internal.qa21.mosip.net\""
    serverHealthCheckPath = "\"/v1/syncdata/actuator/health\""
    serverActuatorInfoPath = "\"/v1/syncdata/actuator/info\""
    debugPassword = "\"APTyKejHxACQyKBSRciR\""
    httpReadTimeout = 60000L
    httpWriteTimeout = 60000L
}


rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

// Sync Kotlin jvmTarget to match each subproject's sourceCompatibility.
// Fixes JVM-target mismatch in third-party Flutter plugins (e.g. qr_code_scanner)
// when running Gradle under JDK 21, where Kotlin 1.9.x defaults jvmTarget to 21
// but the plugin's compileOptions still declare 1.8.
// Uses plugins.withId + configureEach (fully lazy) to avoid afterEvaluate timing errors.
subprojects {
    plugins.withId('org.jetbrains.kotlin.android') {
        tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile).configureEach {
            kotlinOptions.jvmTarget = project.android.compileOptions.sourceCompatibility.toString()
        }
    }
}

// AGP 8 fixes (separate block)
subprojects {

    plugins.withId("com.android.library") {
        def androidExt = project.extensions.findByName("android")
        if (androidExt != null) {
            if (androidExt.namespace == null) {
                androidExt.namespace = "com.auto.${project.name}"
            }
        }
    }

    plugins.withId("com.android.application") {
        def androidExt = project.extensions.findByName("android")
        if (androidExt != null) {
            if (androidExt.namespace == null) {
                androidExt.namespace = "com.auto.${project.name}"
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

subprojects { project ->

    if (project.name.contains("native_image_cropper_android")) {
        project.tasks.whenTaskAdded { task ->
            if (task.name.toLowerCase().contains("ktlint")) {
                task.enabled = false
            }
        }
    }

    // Suppress lint errors in third-party Flutter plugin subprojects whose
    // source we cannot modify. Own modules (app, *manager) are excluded.
    def ownModules = ['app', 'clientmanager', 'keymanager', 'packetmanager', 'transliterationmanager']
    if (!ownModules.contains(project.name)) {
        project.afterEvaluate {
            if (project.extensions.findByName("android") != null) {
                project.android.lint {
                    disable 'NewerVersionAvailable', 'MissingPermission'
                    abortOnError false
                }
            }
        }
    }
}

subprojects {
    def ownModules = ['app', 'clientmanager', 'keymanager', 'packetmanager', 'transliterationmanager']
    tasks.withType(Test).configureEach {
        if (!ownModules.contains(project.name)) {
            enabled = false
        }
        jvmArgs(
            '-XX:+EnableDynamicAgentLoading',
            '-Dnet.bytebuddy.experimental=true',
            '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
            '--add-opens', 'java.base/java.util=ALL-UNNAMED',
            '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED'
        )
    }
}